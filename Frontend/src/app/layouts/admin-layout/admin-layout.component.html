<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand__mark"><app-axiom-logo state="idle" [size]="26" aria-label="Axiom" /></div>
        <div>
          <div class="brand__name">Axiom</div>
          <div class="brand__context">Admin Panel</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-btn" [class.active]="isActive('settings')" (click)="navigateTo('/admin/settings')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Workspace Settings
        </button>

        <button type="button" class="nav-btn" [class.active]="isActive('users')" (click)="navigateTo('/admin/users')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          User Management
        </button>

        <button type="button" class="nav-btn" [class.active]="isActive('analytics')" (click)="navigateTo('/admin/analytics')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          Analytics Dashboard
        </button>

        <button type="button" class="nav-btn" [class.active]="isActive('audit-log')" (click)="navigateTo('/admin/audit-log')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
          </svg>
          Audit Log
        </button>
      </nav>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="back-to-adrs-btn" (click)="goBackToAdrs()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to ADRs
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left">
        <div class="header-avatar">A</div>
        <span class="header-title">Axiom ADR Manager</span>
        <span class="workspace-badge" [title]="workspaceSlug">{{ workspaceName }}</span>
      </div>
      <div class="header-right">
        <app-workspace-switcher />
        <app-notification-dropdown />
        <app-profile-menu />
      </div>
    </header>

    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
</div>
